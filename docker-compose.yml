services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 2s
      retries: 20
    volumes:
      - redis-data:/data

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: chronos
      POSTGRES_USER: chronos
      POSTGRES_PASSWORD: ${CHRONOS_POSTGRES_PASSWORD:-chronos-local-dev}
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chronos -d chronos"]
      interval: 3s
      timeout: 2s
      retries: 20
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./sql:/docker-entrypoint-initdb.d:ro

  kafka:
    image: apache/kafka:3.9.0
    hostname: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 20

  kafka-init:
    image: apache/kafka:3.9.0
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-ec"]
    command:
      - |
        for topic in job-submission job-cancellation job-status-updates worker-heartbeats worker-events job-assignments job-dead-letter; do
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic "$$topic" --partitions 3 --replication-factor 1
        done

  api-gateway:
    build:
      context: .
      target: chronos-runtime
    image: chronos:local
    entrypoint: ["chronos_api_gateway"]
    environment:
      CHRONOS_API_HOST: 0.0.0.0
      CHRONOS_API_PORT: 8080
      CHRONOS_API_KEY: ${CHRONOS_API_KEY:?Set CHRONOS_API_KEY before starting Chronos}
      CHRONOS_KAFKA_BROKERS: kafka:9092
      CHRONOS_DATABASE_URL: postgresql://chronos:${CHRONOS_POSTGRES_PASSWORD:-chronos-local-dev}@postgres:5432/chronos
      CHRONOS_MIGRATIONS_DIR: /app/sql
    ports:
      - "8080:8080"
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy

  scheduler:
    image: chronos:local
    build:
      context: .
      target: chronos-runtime
    entrypoint: ["chronos_scheduler_service"]
    environment:
      CHRONOS_KAFKA_BROKERS: kafka:9092
      CHRONOS_DATABASE_URL: postgresql://chronos:${CHRONOS_POSTGRES_PASSWORD:-chronos-local-dev}@postgres:5432/chronos
      CHRONOS_WORKER_HEARTBEAT_TIMEOUT_MS: 10000
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker-manager:
    image: chronos:local
    build:
      context: .
      target: chronos-runtime
    entrypoint: ["chronos_worker_manager_service"]
    environment:
      CHRONOS_KAFKA_BROKERS: kafka:9092
      CHRONOS_REDIS_HOST: redis
      CHRONOS_REDIS_PORT: 6379
      CHRONOS_WORKER_HEARTBEAT_TTL_MS: 10000
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  worker-agent:
    image: chronos:local
    build:
      context: .
      target: chronos-runtime
    entrypoint: ["chronos_worker_agent"]
    environment:
      CHRONOS_KAFKA_BROKERS: kafka:9092
      CHRONOS_WORKER_ID: ${CHRONOS_WORKER_ID:-}
      CHRONOS_WORKER_CPU_MILLIS: 4000
      CHRONOS_WORKER_MEMORY_BYTES: 8589934592
      CHRONOS_WORKER_GPU_COUNT: 0
      CHRONOS_FAIL_FIRST_JOBS: ${CHRONOS_FAIL_FIRST_JOBS:-0}
    depends_on:
      kafka-init:
        condition: service_completed_successfully

  prometheus:
    image: prom/prometheus:v2.55.1
    ports:
      - "9090:9090"
    volumes:
      - ./deploy/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - api-gateway

volumes:
  postgres-data:
  redis-data:
